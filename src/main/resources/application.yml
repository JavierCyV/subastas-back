server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://db.urkhrndrpidukzztfhht.supabase.co:5432/postgres
    username: postgres
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
          from: ${MAIL_USERNAME}

app:
  jwt:
    secret: ${JWT_SECRET:subastas-secret-key-must-be-at-least-256-bits-long-for-hs256}
    expiration-ms: 86400000  # 24 horas
